<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUCK - Tu espacio personal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/buck.css">
</head>
<body>

  <!-- LOADING -->
  <div id="loadingScreen">Cargando BUCK... 📖</div>

  <!-- LOGIN -->
  <section id="authScreen" class="hidden">
    <div class="login-book">
      <div class="login-logo">BUCK</div>
      <div class="login-sub">Tu espacio personal</div>

      <form id="authForm">
        <div class="field">
          <label>Usuario</label>
          <input id="authEmail" type="text" required placeholder="admin" autocomplete="username">
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input id="authPassword" type="password" required placeholder="1234" autocomplete="current-password">
        </div>
        <button class="primary" type="submit">Entrar a BUCK</button>
        <div class="auth-msg" id="authMsg"></div>
      </form>

      <div class="auth-note">
        🔑 Usuario: <strong>admin</strong> · Contraseña: <strong>1234</strong>
      </div>
    </div>
  </section>

  <!-- APP -->
  <main id="app" class="hidden">
    <div class="controls-header">
      <div class="brand"><span style="font-size:1.3rem">📖</span><strong>BUCK</strong></div>

      <div class="calendar-controls">
        <button class="nav-btn" id="prevMonthBtn">‹</button>
        <input id="monthPicker" type="month">
        <button class="nav-btn" id="nextMonthBtn">›</button>
        <button class="today-btn" id="todayBtn">Hoy</button>
      </div>

      <div class="user-area">
        <span class="user-name" id="userName"></span>
        <button class="logout-btn" id="logoutBtn">Salir</button>
      </div>
    </div>

    <div id="plannerView">
      <div class="notebook">
        <div class="page page-left">
          <div class="calendar-status" id="calendarStatus">
            <span class="autosave-dot" id="autosaveDot"></span>
            <span id="calendarStatusText">CARGANDO...</span>
          </div>

          <div class="header-section">
            <input id="monthTitle" class="month-title" value="" placeholder="MES AÑO">
            <div class="mantra-box">
              <span class="mantra-label">MANTRA:</span>
              <input id="mantraInput" class="mantra-input" placeholder="Escribe tu mantra...">
            </div>
          </div>

          <div class="section-title">HECHOS RELEVANTES:</div>
          <table class="events-table"><tbody id="eventsTableBody"></tbody></table>

          <div class="book-footer"><span>BUCK</span><span>01</span></div>
        </div>

        <div class="page page-right">
          <div class="tracker-container">
            <table class="tracker-table">
              <thead><tr id="trackerHeader"></tr></thead>
              <tbody id="trackerTableBody"></tbody>
            </table>
          </div>

          <div class="objectives-section">
            <div class="objectives-title">🎯 Objetivos del mes</div>
            <div id="objectivesContainer"></div>
          </div>

          <div class="book-footer"><span id="monthSummary">0 hábitos marcados</span><span>02</span></div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <!-- SCRIPTS -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/month.js"></script>

</body>
</html>
